<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沙箱控制 - KGM Playground</title>
    <link rel="stylesheet" href="design-system.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="runtime-subpage-body">
    <nav class="top-nav top-nav-subpage">
        <a href="index.html" class="nav-back-link">← 返回 Playground</a>
        <span class="nav-title nav-title-subpage">Sandbox Control</span>
    </nav>

    <main class="runtime-page-main">
        <section class="runtime-page-intro-block">
            <p>虚拟计算机、浏览器、移动端沙箱的<strong>最小嵌入控制台</strong>。默认可为 simulated 模式，生产环境可替换为真实 adapter（见服务端配置）。</p>
        </section>

        <section class="sandbox-panel">
            <div class="sandbox-header">
                <div>
                    <h2>Sandbox Control</h2>
                    <p>创建、刷新与启停沙箱实例；列表与首页分离以降低主页面负载。</p>
                </div>
                <div class="sandbox-actions">
                    <select id="sandbox-kind-select" aria-label="沙箱类型">
                        <option value="computer">Virtual Computer</option>
                        <option value="browser">Virtual Browser</option>
                        <option value="mobile">Virtual Mobile</option>
                    </select>
                    <button type="button" id="create-sandbox-btn" class="btn btn-secondary">创建 Sandbox</button>
                    <button type="button" id="refresh-sandbox-btn" class="btn btn-secondary">刷新状态</button>
                </div>
            </div>
            <div id="sandbox-list" class="sandbox-list"></div>
        </section>
    </main>

    <script src="sandbox-page.js"></script>
</body>
</html>
