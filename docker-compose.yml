version: "3.9"
services:
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
  kgm:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      KGM_VECTOR_BACKEND: chroma
      KGM_VECTOR_BASE_URL: http://chroma:8000
      KGM_VECTOR_COLLECTION: kgm_memory
      KGM_DB_PROVIDER: sqlite
      KGM_DB_PATH: /app/data/kgm.sqlite
      KGM_DB_JOURNAL: WAL
      KGM_EMBEDDING_PROVIDER: openai
      KGM_EMBEDDING_BASE_URL: https://api.openai.com/v1
      KGM_EMBEDDING_MODEL: text-embedding-3-large
      KGM_EMBEDDING_API_KEY: ${OPENAI_API_KEY}
      KGM_LLM_PROVIDER: openai
      KGM_LLM_BASE_URL: https://api.openai.com/v1
      KGM_LLM_MODEL: gpt-4o-mini
      KGM_LLM_API_KEY: ${OPENAI_API_KEY}
      KGM_LLM_MODE: completions
    volumes:
      - ./data:/app/data
    depends_on:
      - chroma

volumes:
  chroma_data:
